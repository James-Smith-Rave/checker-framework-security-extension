name: DevSecOps Build & Security Assurance Pipeline

on:
push:
branches: [ "main", "master", "develop" ]
pull_request:
branches: [ "main", "master", "develop" ]

permissions:
contents: read
security-events: write

jobs:
build-and-test:
name: Build & Test (${{ matrix.os }})
runs-on: ${{ matrix.os }}
strategy:
  fail-fast: false
  matrix:
    os: [ubuntu-latest, windows-latest]

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'
      cache: 'maven'

  - name: Compile and Run Security Checker Tests
    run: mvn clean test --batch-mode

  - name: Upload Surefire Test Reports
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: surefire-reports-${{ matrix.os }}
      path: target/surefire-reports/

dependency-analysis:
name: Supply Chain Vulnerability Audit
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'
      cache: 'maven'

  - name: OWASP Dependency Check
    run: mvn org.owasp:dependency-check-maven:check -DfailOnError=false --batch-mode

  - name: Upload Dependency Check Report
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: dependency-check-report
      path: target/dependency-check-report.html